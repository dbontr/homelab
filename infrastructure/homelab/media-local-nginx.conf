user nginx;
pid /run/saturn-media-local.pid;
worker_processes 1;
events { worker_connections 1024; }
http {
 server {
  listen 10.77.20.1:443 ssl;
  server_name media.tail305103.ts.net;
  ssl_certificate /var/lib/saturn-media-local-tls/media.crt;
  ssl_certificate_key /var/lib/saturn-media-local-tls/media.key;
  client_max_body_size 0;
  location / {
   proxy_pass http://127.0.0.1:8096;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection "upgrade";
   proxy_buffering off;
  }
 }
}
