apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kueue
  namespace: kube-system
spec:
  chart: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.6/kueue-0.20.6.tgz
  targetNamespace: kueue-system
  createNamespace: true
  timeout: 300s
  backOffLimit: 3
  failurePolicy: abort
  valuesContent: |-
    enableKueueViz: false
    controllerManager:
      replicas: 1
      nodeSelector:
        kubernetes.io/hostname: saturn
      manager:
        image:
          pullPolicy: IfNotPresent
    managerConfig:
      controllerManagerConfigYaml: |-
        apiVersion: config.kueue.x-k8s.io/v1beta2
        kind: Configuration
        health:
          healthProbeBindAddress: :8081
        metrics:
          bindAddress: :8443
        webhook:
          port: 9443
        leaderElection:
          leaderElect: true
          resourceName: c1f6bfd2.kueue.x-k8s.io
        manageJobsWithoutQueueName: false
        managedJobsNamespaceSelector:
          matchLabels:
            homelab.dbontr.me/kueue: enabled
        internalCertManagement:
          enable: true
          webhookServiceName: kueue-webhook-service
          webhookSecretName: kueue-webhook-server-cert
        integrations:
          frameworks:
            - batch/job
