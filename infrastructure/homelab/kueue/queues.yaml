apiVersion: v1
kind: Namespace
metadata:
  name: pwm-batch
  labels:
    homelab.dbontr.me/kueue: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: homelab-venus
spec:
  nodeLabels:
    kubernetes.io/hostname: venus
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: homelab-mercury
spec:
  nodeLabels:
    kubernetes.io/hostname: mercury
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: pwm-cpu
spec:
  namespaceSelector:
    matchLabels:
      homelab.dbontr.me/kueue: enabled
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: homelab-venus
          resources:
            - name: cpu
              nominalQuota: "1"
            - name: memory
              nominalQuota: 2Gi
        - name: homelab-mercury
          resources:
            - name: cpu
              nominalQuota: "2"
            - name: memory
              nominalQuota: 4Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: research-cpu
  namespace: pwm-batch
spec:
  clusterQueue: pwm-cpu
