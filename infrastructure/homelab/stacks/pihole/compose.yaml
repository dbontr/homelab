name: saturn-pihole
services:
  pihole:
    image: pihole/pihole@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
    restart: unless-stopped
    ports:
      - "127.0.0.1:5354:53/tcp"
      - "127.0.0.1:5354:53/udp"
      - "127.0.0.1:8081:80/tcp"
    environment:
      TZ: America/Chicago
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "1.1.1.1;9.9.9.9"
      FTLCONF_dhcp_active: "false"
    volumes:
      - pihole-config:/etc/pihole
volumes:
  pihole-config: {}
