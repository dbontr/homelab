global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/cluster-alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: saturn-node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cluster-nodes
    scrape_interval: 30s
    static_configs:
      - targets: ["10.77.30.229:9100"]
        labels: {node: jupiter}
      - targets: ["10.77.30.230:9100"]
        labels: {node: venus}
      - targets: ["10.77.30.231:9100"]
        labels: {node: mercury}
      - targets: ["10.77.30.232:9100"]
        labels: {node: janus}
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://grafana:3000/api/health", "http://loki:3100/ready", "http://prometheus:9090/-/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox:9115"]
