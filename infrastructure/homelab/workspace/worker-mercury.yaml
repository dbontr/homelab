# Site-specific placement, not application implementation. No credentials belong in this file.
# Use the source-owned, digest-verified Compute worker release.
controller:
  enabled: false
worker:
  enabled: true
  image: ghcr.io/dbontr/homelab/worker@sha256:c7ab035296db9aec360611c52737ca4e94143fb959c7ad56ca536cc20fd6ee4f
  imagePullPolicy: IfNotPresent
  name: pwm-mercury
  projectID: workspace-mcp
  instanceID: ws-mercury
  workloadNamespace: pwm-workspace-mercury
  tokenSecretName: pwm-worker-mercury-credentials
  nodeSelector:
    kubernetes.io/hostname: mercury
  workloadNode: mercury
  cpuCapacity: 3
  memoryCapacityMB: 8192
  maxJobs: 2
  allowedImages: "debian:bookworm-slim"
  workspaceStorage: 10Gi
quota:
  cpu: "5"
  memory: 12Gi
  storage: 100Gi
  maxPods: "16"
  maxPVCs: "16"
  maxJobs: "16"
