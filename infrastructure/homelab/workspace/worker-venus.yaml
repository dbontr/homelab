# Site-specific placement, not application implementation. No credentials belong in this file.
# Use the source-owned, digest-verified Compute worker release.
controller:
  enabled: false
worker:
  enabled: true
  image: ghcr.io/dbontr/homelab/worker@sha256:c7ab035296db9aec360611c52737ca4e94143fb959c7ad56ca536cc20fd6ee4f
  imagePullPolicy: IfNotPresent
  name: pwm-venus
  projectID: workspace-mcp
  instanceID: ws-venus
  workloadNamespace: pwm-workspace-venus
  tokenSecretName: pwm-worker-venus-credentials
  nodeSelector:
    kubernetes.io/hostname: venus
  workloadNode: venus
  cpuCapacity: 2
  memoryCapacityMB: 4096
  maxJobs: 1
  allowedImages: "debian:bookworm-slim"
  workspaceStorage: 10Gi
quota:
  cpu: "4"
  memory: 6Gi
  storage: 100Gi
  maxPods: "16"
  maxPVCs: "16"
  maxJobs: "16"
