# Site-specific placement, not application implementation. No credentials belong in this file.
# Built from dbontr/workspace-mcp commit 9967ebc7c96393bc92415869260c746f3bfa239c.
controller:
  enabled: false
worker:
  enabled: true
  image: docker.io/library/project-workspace-worker:git-9967ebc7c963
  imagePullPolicy: IfNotPresent
  name: pwm-jupiter
  projectID: workspace-mcp
  instanceID: ws-jupiter
  workloadNamespace: pwm-workspace-jupiter
  tokenSecretName: pwm-worker-jupiter-credentials
  nodeSelector:
    kubernetes.io/hostname: jupiter
  workloadNode: jupiter
  cpuCapacity: 8
  memoryCapacityMB: 16384
  maxJobs: 2
  allowedImages: "debian:bookworm-slim,docker.io/library/pwm-openvino-npu:driver"
  workspaceStorage: 10Gi
  deviceManifestConfigMap: pwm-accelerator-inventory
  gpuRuntimeClassName: nvidia-cdi
quota:
  cpu: "12"
  memory: 24Gi
  storage: 100Gi
  maxPods: "16"
  maxPVCs: "16"
  maxJobs: "16"
