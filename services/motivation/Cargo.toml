[package]
name = "homelab-motivation"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Private adaptive motivation service for owner-defined goals"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
fs2 = "0.4"
libc = "0.2"
