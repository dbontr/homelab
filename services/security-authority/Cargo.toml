[package]
name = "homelab-security-authority"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent owner authentication and authorization kernel"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.40", default-features = false, features = ["std", "serde"] }
data-encoding = "2.6.0"
fs2 = "0.4.3"
getrandom = "0.3.3"
hex = "0.4.3"
hmac = "0.12.1"
libc = "0.2.171"
pbkdf2 = "0.12.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = "1.8.1"
