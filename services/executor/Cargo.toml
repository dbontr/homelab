[package]
name = "homelab-executor-authority"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent, owner-authorized privileged host execution"

[dependencies]
axum = { version = "0.8.6", features = ["json", "tokio"] }
bytes = "1.10"
chrono = { version = "0.4.40", default-features = false, features = ["clock", "serde", "std"] }
fs2 = "0.4.3"
getrandom = "0.3.3"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.17", features = ["server", "http1", "tokio", "service"] }
libc = "0.2.171"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "process", "time", "signal", "sync", "io-util"] }
tokio-rustls = "0.26.4"
tower = { version = "0.5.2", features = ["util"] }
url = "2.5.4"
x509-parser = "0.17.0"
zeroize = "1.8.1"
