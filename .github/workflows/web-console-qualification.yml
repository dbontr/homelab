name: Web console source qualification

on:
  push:
    branches:
      - qualification/go-web-engineering
    paths:
      - ".github/workflows/web-console-qualification.yml"
      - "ui/web/**"
      - "packages/console-web.nix"
      - "flake.nix"
  pull_request:
    paths:
      - ".github/workflows/web-console-qualification.yml"
      - "ui/web/**"
      - "packages/console-web.nix"
      - "flake.nix"

permissions:
  contents: read

jobs:
  web-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify dependency lock and compile console
        working-directory: ui/web
        run: |
          set -euo pipefail
          if [ ! -s package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            printf 'HOMELAB_NPM_LOCK_START\n'
            base64 -w 0 package-lock.json
            printf '\nHOMELAB_NPM_LOCK_END\n'
            echo "A reviewed dependency lockfile must be committed before qualification."
            exit 78
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
