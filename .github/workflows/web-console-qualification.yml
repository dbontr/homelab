name: Web console source qualification

on:
  push:
    branches:
      - qualification/go-web-engineering
    paths:
      - ".github/workflows/web-console-qualification.yml"
      - "ui/web/**"
      - "packages/console-web.nix"
      - "flake.nix"
      - "nixosModules/console.nix"
  pull_request:
    paths:
      - ".github/workflows/web-console-qualification.yml"
      - "ui/web/**"
      - "packages/console-web.nix"
      - "flake.nix"
      - "nixosModules/console.nix"

permissions:
  contents: read

jobs:
  web-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies and compile console
        working-directory: ui/web
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build

  nix-console:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build exact-source Nix web console package
        run: nix build --no-link .#homelab-console-web
