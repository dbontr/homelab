name: Go operational package qualification

on:
  pull_request:
    paths:
      - ".github/workflows/go-operational-packages.yml"
      - "services/core/**"
      - "services/compute/**"
      - "services/native-hardware/**"
      - "packages/**"
      - "infrastructure/**"
      - "nixosModules/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-platform-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build source-pinned Go service packages
        run: |
          set -euo pipefail
          nix build --no-link --max-jobs 2 --cores 2 \
            .#homelab-security \
            .#homelab-executor \
            .#homelab-engineering \
            .#homelab-platform \
            .#homelab-native-hardware
      - name: Verify executable outputs
        run: |
          set -euo pipefail
          for name in homelab-security homelab-executor homelab-engineering homelab-platform homelab-native-hardware; do
            result="$(nix path-info ".#${name}")"
            test -d "${result}/bin"
            test -n "$(find "${result}/bin" -maxdepth 1 -type f -o -type l | head -1)"
          done
