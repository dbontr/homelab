name: Security authority acceptance

on:
  push:
    branches:
      - feature/rust-security-authority-core
    paths:
      - services/security-authority/**
      - services/core/security/**
      - .github/workflows/security-authority.yml
  pull_request:
    paths:
      - services/security-authority/**
      - services/core/security/**
      - packages/security-authority.nix
      - nixosModules/security.nix
      - .github/workflows/security-authority.yml

permissions:
  contents: read

jobs:
  rust-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify committed security dependency lock
        run: |
          test -s services/security-authority/Cargo.lock
          git ls-files --error-unmatch services/security-authority/Cargo.lock >/dev/null
      - name: Check formatting
        working-directory: services/security-authority
        run: cargo fmt --all -- --check
      - name: Compile and test all targets
        working-directory: services/security-authority
        run: cargo test --locked --all-targets
      - name: Check warnings
        working-directory: services/security-authority
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release binaries
        working-directory: services/security-authority
        run: cargo build --locked --release --bins

  go-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum
      - name: Cross-language security fixtures
        working-directory: services/core
        run: go test -race -count=1 ./security -run TestSecurityAuthority
      - name: Security and executor regressions
        working-directory: services/core
        run: go test -race -count=1 ./security ./privileged
