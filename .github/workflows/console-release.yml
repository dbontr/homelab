name: Build Rust console

on:
  pull_request:
    paths:
      - ".github/workflows/console-release.yml"
      - "ui/console/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned Dioxus build tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/homelab-tools/bin:$PATH"
          install -d -m 0755 "$RUNNER_TEMP/homelab-tools/bin"
          fetch_asset() {
            local repo="$1" tag="$2" name="$3" output="$4" json record url digest
            json="$(curl --fail --silent --show-error --location --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$repo/releases/tags/$tag")"
            record="$(jq -r --arg name "$name" \
              '.assets[] | select(.name == $name) | [.browser_download_url, .digest] | @tsv' <<<"$json")"
            [[ -n "$record" ]] || { echo "Required release asset missing: $name" >&2; return 1; }
            IFS=$'\t' read -r url digest <<<"$record"
            [[ "$url" == https://github.com/* ]] || return 1
            [[ "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]] || return 1
            curl --fail --silent --show-error --location --retry 3 "$url" -o "$output"
            printf '%s  %s\n' "${digest#sha256:}" "$output" | sha256sum --check --status
          }
          fetch_asset "DioxusLabs/dioxus" "v0.7.10" \
            "dx-x86_64-unknown-linux-gnu.tar.gz" "$RUNNER_TEMP/dx.tar.gz"
          fetch_asset "wasm-bindgen/wasm-bindgen" "0.2.130" \
            "wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz" \
            "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          tar -xzf "$RUNNER_TEMP/dx.tar.gz" -C "$RUNNER_TEMP/homelab-tools/bin" dx
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP/homelab-tools"
          wasm_bindgen="$(find "$RUNNER_TEMP/homelab-tools" -type f -name wasm-bindgen -print -quit)"
          test -n "$wasm_bindgen"
          install -m 0755 "$wasm_bindgen" "$RUNNER_TEMP/homelab-tools/bin/wasm-bindgen"
          "$RUNNER_TEMP/homelab-tools/bin/dx" --version
          "$RUNNER_TEMP/homelab-tools/bin/wasm-bindgen" --version
      - name: Build web bundle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/homelab-tools/bin:$PATH"
          cd ui/console
          cargo check --locked --target wasm32-unknown-unknown
          dx bundle --web --release --out-dir "$RUNNER_TEMP/console-bundle"
          test -s "$RUNNER_TEMP/console-bundle/public/index.html"
          find "$RUNNER_TEMP/console-bundle/public" -type f -name '*.wasm' -size +0c -print | grep -q .
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/console-bundle/public/SOURCE_REVISION"
      - name: Upload source-bound console artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-console-${{ github.sha }}
          path: ${{ runner.temp }}/console-bundle/public/
          if-no-files-found: error
          retention-days: 7
