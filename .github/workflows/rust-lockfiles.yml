name: Resolve Rust release dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rust-native-execution-boundaries
    paths:
      - ".github/workflows/rust-lockfiles.yml"
      - "services/security-authority/Cargo.toml"
      - "services/executor/Cargo.toml"
      - "services/motivation/Cargo.toml"
      - "ui/console/Cargo.toml"
  pull_request:
    paths:
      - ".github/workflows/rust-lockfiles.yml"
      - "services/security-authority/Cargo.toml"
      - "services/executor/Cargo.toml"
      - "services/motivation/Cargo.toml"
      - "ui/console/Cargo.toml"

permissions:
  contents: write

concurrency:
  group: rust-lockfiles-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository == 'dbontr/homelab' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the draft branch
        uses: actions/checkout@v4
        with:
          ref: feature/rust-native-execution-boundaries
          persist-credentials: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependency graphs
        run: |
          set -euo pipefail
          mkdir -p lock-diagnostics
          rustc --version > lock-diagnostics/toolchain.txt
          cargo --version >> lock-diagnostics/toolchain.txt
          for manifest in services/security-authority/Cargo.toml services/executor/Cargo.toml services/motivation/Cargo.toml ui/console/Cargo.toml; do
            name="$(basename "$(dirname "$manifest")")"
            if ! cargo generate-lockfile --manifest-path "$manifest" > "lock-diagnostics/$name.log" 2>&1; then
              cat "lock-diagnostics/$name.log"
              exit 1
            fi
            cat "lock-diagnostics/$name.log"
            cargo metadata --format-version 1 --locked --no-deps --manifest-path "$manifest" > /dev/null
          done
          for manifest in services/security-authority/Cargo.toml services/executor/Cargo.toml services/motivation/Cargo.toml ui/console/Cargo.toml; do
            cargo fmt --all --manifest-path "$manifest"
          done
          git diff --check
          for file in services/security-authority/Cargo.lock services/executor/Cargo.lock services/motivation/Cargo.lock ui/console/Cargo.lock; do
            test -s "$file"
            grep -q '^version = 4$' "$file"
          done
      - name: Preserve Cargo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-resolution
          path: lock-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit reviewed-scope lockfiles
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          git add -f -- services/security-authority/Cargo.lock services/executor/Cargo.lock services/motivation/Cargo.lock ui/console/Cargo.lock
          git add -u -- services/security-authority/src services/executor/src services/motivation/src ui/console/src
          if git diff --cached --quiet; then
            echo "Cargo locks and Rust formatting already match the manifests."
            exit 0
          fi
          git -c user.name=homelab-build -c user.email=build@users.noreply.github.com commit -m "Normalize Rust code and lock release dependencies"
          git push origin HEAD:feature/rust-native-execution-boundaries
