name: Resolve Rust release dependencies

on:
  push:
    branches:
      - feature/rust-native-execution-boundaries
    paths:
      - ".github/workflows/rust-lockfiles.yml"
      - "services/security-authority/Cargo.toml"
      - "services/executor/Cargo.toml"
      - "services/motivation/Cargo.toml"
      - "ui/console/Cargo.toml"
  pull_request:
    paths:
      - ".github/workflows/rust-lockfiles.yml"
      - "services/security-authority/Cargo.toml"
      - "services/executor/Cargo.toml"
      - "services/motivation/Cargo.toml"
      - "ui/console/Cargo.toml"

permissions:
  contents: write

concurrency:
  group: rust-lockfiles-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feature/rust-native-execution-boundaries') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feature/rust-native-execution-boundaries')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/rust-native-execution-boundaries
          persist-credentials: true
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Generate authentic Cargo lockfiles
        run: |
          set -euo pipefail
          mkdir -p lock-diagnostics
          rustc --version > lock-diagnostics/toolchain.txt
          cargo --version >> lock-diagnostics/toolchain.txt
          for manifest in services/security-authority/Cargo.toml services/executor/Cargo.toml services/motivation/Cargo.toml ui/console/Cargo.toml; do
            echo "Resolving $manifest"
            if ! cargo generate-lockfile --manifest-path "$manifest" > lock-diagnostics/last.log 2>&1; then
              cat lock-diagnostics/last.log
              cp lock-diagnostics/last.log "lock-diagnostics/$(basename "$(dirname "$manifest")").log"
              exit 1
            fi
            cp lock-diagnostics/last.log "lock-diagnostics/$(basename "$(dirname "$manifest")").log"
            cat lock-diagnostics/last.log
          done
          for file in services/security-authority/Cargo.lock services/executor/Cargo.lock services/motivation/Cargo.lock ui/console/Cargo.lock; do
            test -s "$file"
            grep -q '^version = 4
      - name: Commit reviewed-scope dependency resolution
        run: |
          set -euo pipefail
          git add -f -- services/security-authority/Cargo.lock services/executor/Cargo.lock services/motivation/Cargo.lock ui/console/Cargo.lock
          if git diff --cached --quiet; then
            echo 'All Rust dependency locks are current.'
            exit 0
          fi
          git -c user.name='homelab-build' -c user.email='build@users.noreply.github.com' commit -m 'Lock Rust release dependencies for reproducible builds'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
 "$file"
          done
      - name: Preserve resolution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-resolution
          path: lock-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit reviewed-scope dependency resolution
        run: |
          set -euo pipefail
          git add -f -- services/security-authority/Cargo.lock services/executor/Cargo.lock services/motivation/Cargo.lock ui/console/Cargo.lock
          if git diff --cached --quiet; then
            echo 'All Rust dependency locks are current.'
            exit 0
          fi
          git -c user.name='homelab-build' -c user.email='build@users.noreply.github.com' commit -m 'Lock Rust release dependencies for reproducible builds'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
