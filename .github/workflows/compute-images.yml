name: Publish Compute OCI images

on:
  push:
    branches:
      - feature/rust-native-execution-boundaries
    paths:
      - ".github/workflows/compute-images.yml"
      - "services/compute/**"
      - "scripts/build-compute-images.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compute-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dbontr/homelab'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Verify Compute module
        run: |
          set -euo pipefail
          cd services/compute
          GOWORK=off go test -count=1 ./...
      - name: Verify guarded worker-rollout contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n services/compute/scripts/rollout-project-worker.sh
          bash -n services/compute/scripts/rollout-project-fleet.sh
          bash -n services/compute/scripts/tests/rollout-project-worker-test.sh
          bash services/compute/scripts/tests/rollout-project-worker-test.sh
      - name: Set up OCI build
        uses: docker/setup-buildx-action@v3
      - name: Authenticate registry publisher
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish source-bound images
        run: |
          set -euo pipefail
          bash scripts/build-compute-images.sh \
            ghcr.io/dbontr/homelab \
            "$RUNNER_TEMP/compute-image-release" --push
      - name: Verify registry digests
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/compute-image-release/IMAGE-RELEASE.json"
          test -s "$release"
          jq -e --arg source "$(git rev-parse HEAD)" \
            '.mode == "registry" and .platform == "linux/amd64" and .source_revision == $source' \
            "$release" >/dev/null
          for component in controller worker; do
            image="$(jq -er --arg component "${component}_image" '.[$component]' "$release")"
            [[ "$image" =~ ^ghcr\.io/dbontr/homelab/(controller|worker)@sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$image" >/dev/null
          done
      - name: Preserve deployment candidate receipts
        uses: actions/upload-artifact@v4
        with:
          name: compute-image-release-${{ github.sha }}
          path: ${{ runner.temp }}/compute-image-release/IMAGE-RELEASE.json
          if-no-files-found: error
          retention-days: 30
