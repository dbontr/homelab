name: Rust dependency lock generation

on:
  pull_request:
    paths:
      - "services/security-authority/Cargo.toml"
      - "services/executor/Cargo.toml"
      - "services/motivation/Cargo.toml"
      - "ui/console/Cargo.toml"
      - ".github/workflows/rust-dependency-locks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: security-authority
            crate: services/security-authority
          - name: executor
            crate: services/executor
          - name: motivation
            crate: services/motivation
          - name: console
            crate: ui/console
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve complete dependency graph
        env:
          CARGO_NET_RETRY: "3"
        run: cargo generate-lockfile --manifest-path "${{ matrix.crate }}/Cargo.toml"
      - name: Fetch pinned dependency sources
        run: cargo fetch --locked --manifest-path "${{ matrix.crate }}/Cargo.toml"
      - name: Publish reviewed lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ matrix.name }}
          path: "${{ matrix.crate }}/Cargo.lock"
          if-no-files-found: error
          retention-days: 7
